<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tesla Headline Study — resolve gold disagreements</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #14161a; color: #e6e6e6; margin: 0; }
  #loadbar { padding: 40px; text-align: center; }
  header { position: sticky; top: 0; background: #1c1f24; border-bottom: 1px solid #2c3038; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
  header .progress { font-variant-numeric: tabular-nums; color: #9aa0a8; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 24px 180px; }
  .incident-id { font-size: 13px; color: #7d8590; margin-bottom: 12px; }
  .compare { display: flex; gap: 12px; margin-bottom: 18px; }
  .compare .card { flex: 1; background: #1a1d22; border: 1px solid #262a31; border-radius: 8px; padding: 14px 16px; text-align: center; }
  .compare .card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #7d8590; margin: 0 0 8px; }
  .compare .card .val { font-size: 20px; font-weight: 600; }
  .compare .card.yours .val { color: #82b1ff; }
  .compare .card.ai .val { color: #ffcc80; }
  section { background: #1a1d22; border: 1px solid #262a31; border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
  section h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: #7d8590; margin: 0 0 8px; }
  .body { white-space: pre-wrap; font-size: 14px; line-height: 1.6; color: #d7dae0; }
  .hidden { display: none; }
  .answer-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1f24; border-top: 1px solid #2c3038; padding: 14px 24px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .answer-bar button { border: 1px solid #3a3f47; border-radius: 6px; padding: 9px 16px; font-size: 14px; cursor: pointer; background: #2c3038; color: #e6e6e6; }
  .answer-bar button.yours { border-color: #82b1ff; color: #82b1ff; }
  .answer-bar button.ai { border-color: #ffcc80; color: #ffcc80; }
  .answer-bar input { background: #14161a; border: 1px solid #3a3f47; color: #e6e6e6; padding: 8px 12px; border-radius: 5px; font-size: 14px; width: 200px; }
  .answer-bar .save { background: #4f8cff; border: none; color: white; }
  #done-screen { text-align: center; padding: 80px 20px; }
  #done-screen button { margin-top: 20px; font-size: 15px; padding: 10px 20px; background: #4f8cff; border: none; border-radius: 6px; color: white; cursor: pointer; }
  .toast { position: fixed; top: 14px; right: 24px; background: #1f3a24; color: #81c995; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .resolved-tag { font-size: 12px; color: #81c995; margin-top: 6px; }
</style>
</head>
<body>

<div id="loadbar">
  <h2>Resolve gold-standard disagreements</h2>
  <p>For each case, read the article text and decide the true make: your original answer,
     the AI's answer, or type a corrected third answer if both were wrong.</p>
  <p>Load <code>gold_disagreements.json</code>:</p>
  <input type="file" id="fileInput" accept="application/json">
</div>

<header id="header" class="hidden">
  <span id="progressText" class="progress"></span>
  <button onclick="exportResolved()" style="background:#2c3038;border:1px solid #3a3f47;color:#e6e6e6;border-radius:5px;padding:6px 14px;cursor:pointer;">Export resolved.csv</button>
</header>

<main id="main" class="hidden"></main>

<div id="done-screen" class="hidden">
  <h2>All disagreements resolved</h2>
  <p id="doneSummary" style="color:#9aa0a8;"></p>
  <button onclick="exportResolved()">Export resolved.csv</button>
</div>

<div class="answer-bar hidden" id="answerBar">
  <button class="yours" onclick="resolve('yours')">My answer was right (1)</button>
  <button class="ai" onclick="resolve('ai')">AI was right (2)</button>
  <input type="text" id="customInput" placeholder="or type the real answer...">
  <button class="save" onclick="resolveCustom()">Save custom (Enter)</button>
</div>

<div id="toast" class="toast">Saved</div>

<script>
let cases = [];
let idx = 0;
let resolved = {};
const STORAGE_KEY = "tesla_study_resolve_v1";

document.getElementById("fileInput").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    cases = JSON.parse(reader.result);
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) resolved = JSON.parse(saved);
    document.getElementById("loadbar").classList.add("hidden");
    document.getElementById("header").classList.remove("hidden");
    document.getElementById("main").classList.remove("hidden");
    document.getElementById("answerBar").classList.remove("hidden");
    idx = cases.findIndex(c => !(c.incident_id in resolved));
    if (idx === -1) idx = 0;
    render();
  };
  reader.readAsText(file);
});

function esc(s) {
  if (s === null || s === undefined || s === "") return "(none)";
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function render() {
  if (idx >= cases.length) { showDone(); return; }
  const c = cases[idx];
  const nDone = Object.keys(resolved).length;
  document.getElementById("progressText").textContent = `${idx + 1} / ${cases.length} · ${nDone} resolved`;

  const bodiesHtml = c.articles.map(a => `
    <section>
      <h2>${esc(a.outlet)}</h2>
      <div class="body">${esc(a.body)}</div>
    </section>`).join("");

  const already = resolved[c.incident_id];

  document.getElementById("main").innerHTML = `
    <div class="incident-id">${esc(c.incident_id)}</div>
    <div class="compare">
      <div class="card yours"><h2>Your answer</h2><div class="val">${esc(c.your_answer)}</div></div>
      <div class="card ai"><h2>AI answer</h2><div class="val">${esc(c.ai_answer)}</div></div>
    </div>
    ${already ? `<div class="resolved-tag">Already resolved: ${esc(already)}</div>` : ''}
    ${bodiesHtml}
  `;
  document.getElementById("customInput").value = "";
  document.getElementById("customInput").focus();
}

function resolve(which) {
  const c = cases[idx];
  resolved[c.incident_id] = which === 'yours' ? c.your_answer : c.ai_answer;
  save();
}

function resolveCustom() {
  const val = document.getElementById("customInput").value.trim();
  if (!val) return;
  const c = cases[idx];
  resolved[c.incident_id] = val;
  save();
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(resolved));
  const t = document.getElementById("toast");
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 400);
  if (idx < cases.length - 1) { idx++; render(); }
  else { idx = cases.length; showDone(); }
}

function showDone() {
  document.getElementById("main").classList.add("hidden");
  document.getElementById("answerBar").classList.add("hidden");
  document.getElementById("done-screen").classList.remove("hidden");
  document.getElementById("doneSummary").textContent = `${Object.keys(resolved).length} / ${cases.length} resolved.`;
}

function exportResolved() {
  const rows = cases.filter(c => c.incident_id in resolved)
    .map(c => ({incident_id: c.incident_id, index_make: resolved[c.incident_id]}));
  const header = "incident_id,index_make\n";
  const body = rows.map(r => `${r.incident_id},${(r.index_make||'').replace(/,/g,';')}`).join("\n");
  const blob = new Blob([header + body], {type: "text/csv"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "resolved_disagreements.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.addEventListener("keydown", (e) => {
  if (document.activeElement.id === "customInput") {
    if (e.key === "Enter") resolveCustom();
    return;
  }
  if (e.key === "1") resolve('yours');
  if (e.key === "2") resolve('ai');
});
</script>
</body>
</html>
